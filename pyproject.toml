[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infomamba"
version = "0.1.0"
description = "InfoMamba: Recovering Information Lost in Hidden-State Compression"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "transformers>=4.45",
]

[project.optional-dependencies]
food = ["mambavision"]

[tool.setuptools.packages.find]
where = ["src"]
