[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infomamba"
version = "0.1.0"
description = "InfoMamba: information-gated state space models for visual recognition"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "PyYAML>=6.0",
  "Pillow>=10.0",
]

[tool.setuptools.packages.find]
where = ["src"]
